<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, system-ui, sans-serif; width: 300px; margin: 0; padding: 12px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  p { font-size: 12px; color: #555; margin: 6px 0; }
  button { width: 100%; margin-top: 8px; padding: 8px; font-size: 13px; cursor: pointer; }
  #status { font-size: 12px; margin-top: 8px; white-space: pre-wrap; }
  .hint { color: #888; }
</style>
</head>
<body>
  <h1>fb-pfp</h1>
  <p>Pick 2 or more images. One is chosen at random (no repeats until all are used) and set as your Facebook profile picture.</p>
  <input type="file" id="files" accept="image/jpeg,image/png,image/webp" multiple>
  <p id="stored" class="hint"></p>
  <button id="dry">Dry run (stop before Save)</button>
  <button id="go">Change profile picture now</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
